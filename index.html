<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מלאי - מערך אובייקטים</title>
    <style>
        :root {
            --primary: #003d7c;
            --accent: #00a3ad;
            --bg: #f8fafc;
            --white: #ffffff;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { color: var(--primary); margin-bottom: 10px; }
        .description { color: #64748b; margin-bottom: 40px; text-align: center; max-width: 600px; }

        /* קונטיינר המערך */
        .array-row {
            display: flex;
            gap: 20px;
            padding: 50px 30px 30px;
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 24px;
            position: relative;
            overflow-x: auto;
            max-width: 95vw;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .array-row::before {
            content: "Product[] inventory";
            position: absolute;
            top: 15px;
            right: 30px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
        }

        /* עטיפת אובייקט */
        .item-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 180px;
        }

        /* כרטיס האובייקט - State */
        .card {
            width: 100%;
            background: var(--white);
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 15px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .index-label {
            position: absolute;
            top: -35px;
            font-family: monospace;
            font-weight: bold;
            color: var(--accent);
            font-size: 18px;
        }

        .icon { font-size: 45px; margin-bottom: 8px; }
        .name { font-weight: bold; color: #1e293b; margin-bottom: 12px; }

        /* פאנל תכונות */
        .props {
            width: 100%;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
        }

        .prop-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px solid #e2e8f0;
        }
        .prop-line:last-child { border: none; }
        .val { font-weight: bold; color: var(--primary); transition: transform 0.2s; display: inline-block; }
        .val.bump { transform: scale(1.3); color: var(--success); }

        /* מצבי לוגיקה */
        .card.scanning { border-color: var(--info); box-shadow: 0 0 15px var(--info); transform: translateY(-5px); }
        .card.low-stock { border-color: var(--danger); background-color: #fef2f2; }
        .out-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
        }
        .card.low-stock .out-badge { display: block; }

        /* פעולות - Methods */
        .methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .m-btn {
            border: none;
            border-radius: 6px;
            padding: 6px 2px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .m-btn:hover { opacity: 0.8; }
        .btn-sell { background: var(--danger); }
        .btn-buy { background: var(--success); }
        .btn-promo { background: var(--warning); }
        .btn-size { background: var(--info); }

        /* כפתורי בקרה ראשיים */
        .controls {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .action-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 16px;
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-reset { background: var(--primary); color: white; }
        .btn-scan { background: var(--danger); color: white; }

        .terminal {
            width: 650px;
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            direction: ltr;
            min-height: 50px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>מערך אובייקטים וניהול מלאי</h1>
    <p class="description">התכונות (Attributes) גלויות בתוך כל אובייקט. הפעולות (Methods) מופעלות מבחוץ ומשנות את הנתונים.</p>

    <div class="array-row" id="inventory-container">
        <!-- נבנה באמצעות JS -->
    </div>

    <div class="controls">
        <div style="display: flex; gap: 10px;">
            <button class="action-btn btn-reset" onclick="init()">אתחל מערך</button>
            <button class="action-btn btn-scan" onclick="scanShortages()">סרוק חוסרים (מלאי < 3)</button>
        </div>
        <div class="terminal" id="output">> מחכה לפעולה...</div>
    </div>

    <script>
        const initialItems = [
            { name: "חולצה", price: 80, stock: 10, size: "M", icon: "👕" },
            { name: "ג'ינס", price: 200, stock: 2, size: "42", icon: "👖" },
            { name: "מעיל", price: 350, stock: 5, size: "L", icon: "🧥" },
            { name: "כובע", price: 60, stock: 1, size: "OS", icon: "🧢" },
            { name: "נעליים", price: 280, stock: 7, size: "44", icon: "👟" },
            { name: "גרביים", price: 25, stock: 15, size: "38", icon: "🧦" }
        ];

        let inventory = [];

        function init() {
            inventory = JSON.parse(JSON.stringify(initialItems));
            render();
            log("inventory = new Product[6]; // המערך אותחל בזיכרון");
        }

        function render() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = '';
            
            inventory.forEach((item, i) => {
                const lowStockClass = item.stock < 3 ? 'low-stock' : '';
                container.insertAdjacentHTML('beforeend', `
                    <div class="item-node">
                        <div class="card ${lowStockClass}" id="card-${i}">
                            <div class="out-badge">חסר!</div>
                            <div class="index-label">[${i}]</div>
                            <div class="icon">${item.icon}</div>
                            <div class="name">${item.name}</div>
                            
                            <div class="props">
                                <div class="prop-line"><span>מחיר:</span> <span class="val" id="p-${i}">₪${item.price}</span></div>
                                <div class="prop-line"><span>מלאי:</span> <span class="val" id="s-${i}">${item.stock}</span></div>
                                <div class="prop-line"><span>מידה:</span> <span class="val" id="z-${i}">${item.size}</span></div>
                            </div>
                        </div>

                        <div class="methods">
                            <button class="m-btn btn-sell" onclick="sell(${i})">sell()</button>
                            <button class="m-btn btn-buy" onclick="buy(${i})">buy(5)</button>
                            <button class="m-btn btn-promo" onclick="promo(${i})">promo()</button>
                            <button class="m-btn btn-size" onclick="setSize(${i})">size()</button>
                        </div>
                    </div>
                `);
            });
        }

        function sell(i) {
            if(inventory[i].stock > 0) {
                inventory[i].stock--;
                log(`inventory[${i}].sell(); // מלאי כעת: ${inventory[i].stock}`);
                updateUI(i, 's');
            }
        }

        function buy(i) {
            inventory[i].stock += 5;
            log(`inventory[${i}].buy(5); // מלאי כעת: ${inventory[i].stock}`);
            updateUI(i, 's');
        }

        function promo(i) {
            inventory[i].price = Math.floor(inventory[i].price * 0.9);
            log(`inventory[${i}].promo(); // מחיר חדש: ₪${inventory[i].price}`);
            updateUI(i, 'p');
        }

        function setSize(i) {
            const ns = prompt("הכנס מידה:");
            if(ns) {
                inventory[i].size = ns;
                log(`inventory[${i}].setSize("${ns}");`);
                updateUI(i, 'z');
            }
        }

        function updateUI(i, key) {
            document.getElementById(`s-${i}`).innerText = inventory[i].stock;
            document.getElementById(`p-${i}`).innerText = "₪" + inventory[i].price;
            document.getElementById(`z-${i}`).innerText = inventory[i].size;
            
            const v = document.getElementById(`${key}-${i}`);
            v.classList.add('bump');
            setTimeout(() => v.classList.remove('bump'), 400);

            const card = document.getElementById(`card-${i}`);
            if(inventory[i].stock < 3) card.classList.add('low-stock');
            else card.classList.remove('low-stock');
        }

        async function scanShortages() {
            log("for(Product p : inventory) { if(p.stock < 3) showAlert(); }");
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => c.classList.remove('scanning'));
            
            let missingNames = [];

            for(let i=0; i < inventory.length; i++) {
                const card = document.getElementById(`card-${i}`);
                card.classList.add('scanning');
                log(`Checking inventory[${i}]... stock is ${inventory[i].stock}`);
                
                await new Promise(r => setTimeout(r, 600));
                
                if(inventory[i].stock < 3) {
                    card.classList.add('low-stock');
                    log(`Found shortage at [${i}]: ${inventory[i].name}`);
                    missingNames.push(inventory[i].name);
                }
                card.classList.remove('scanning');
                await new Promise(r => setTimeout(r, 200));
            }

            if(missingNames.length > 0) {
                log(`הסריקה הסתיימה.\nפריטים חסרים: ${missingNames.join(", ")}`);
            } else {
                log(`הסריקה הסתיימה. כל המלאי תקין!`);
            }
        }

        function log(m) { document.getElementById('output').innerText = "> " + m; }

        window.onload = init;
    </script>
</body>
</html>
